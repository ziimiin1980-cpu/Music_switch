name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build
        run: pyinstaller pereklych.spec --noconfirm --clean

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart("v")
          $asset = "Pereklych-$version-win64.zip"
          Compress-Archive -Path dist\Pereklych -DestinationPath $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash
          "$hash  $asset" | Set-Content -Encoding ascii SHA256SUMS.txt
          "ASSET_NAME=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG_NAME --title "Pereklych $($env:TAG_NAME.TrimStart('v'))" --generate-notes
          }
          gh release upload $env:TAG_NAME $env:ASSET_NAME SHA256SUMS.txt --clobber
